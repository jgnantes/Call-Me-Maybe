[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling tool using constrained decoding with a small LLM."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = [
    "data/",
    "huggingface-env/",
    "llm_sdk/",
    "zip/",
]
